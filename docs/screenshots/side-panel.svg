<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-label="Chrome Page Fixer Side Panel preview">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .bar { fill: #e5e7eb; }
      .title { font: 600 13px -apple-system, system-ui, sans-serif; fill: #1f2328; }
      .meta { font: 11px -apple-system, system-ui, sans-serif; fill: #6b7280; }
      .row { font: 12px -apple-system, system-ui, sans-serif; fill: #1f2328; }
      .muted { font: 11px -apple-system, system-ui, sans-serif; fill: #6b7280; }
      .level-err { fill: #d92d20; }
      .level-warn { fill: #b54708; }
      .level-info { fill: #175cd3; }
      .card { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1; }
      .btn { fill: #ffffff; stroke: #e5e7eb; }
    </style>
  </defs>
  <rect width="360" height="240" class="bg"/>
  <rect x="0" y="0" width="360" height="32" class="bar"/>
  <text x="14" y="20" class="title">Chrome Page Fixer</text>
  <rect x="248" y="8" width="100" height="16" rx="3" class="btn"/>
  <text x="260" y="20" class="meta">复制最近 5 条</text>
  <rect x="0" y="32" width="360" height="22" class="bar"/>
  <text x="14" y="48" class="meta">3 / 200 条</text>
  <g transform="translate(0,72)">
    <rect x="0" y="0" width="4" height="44" class="level-err"/>
    <text x="14" y="16" class="level-err" style="font-weight:600; font-size:10px;">ERROR</text>
    <text x="60" y="16" class="meta">09:54:07</text>
    <text x="14" y="34" class="row">GET http://test.../avatar.png → 502</text>
  </g>
  <line x1="0" y1="116" x2="360" y2="116" class="bar"/>
  <g transform="translate(0,128)">
    <rect x="0" y="0" width="4" height="44" class="level-warn"/>
    <text x="14" y="16" class="level-warn" style="font-weight:600; font-size:10px;">WARN</text>
    <text x="60" y="16" class="meta">09:55:02</text>
    <text x="14" y="34" class="row">[fixture] console.warn: deprecated api</text>
  </g>
  <line x1="0" y1="172" x2="360" y2="172" class="bar"/>
  <g transform="translate(0,184)">
    <rect x="0" y="0" width="4" height="44" class="level-info"/>
    <text x="14" y="16" class="level-info" style="font-weight:600; font-size:10px;">INFO</text>
    <text x="60" y="16" class="meta">09:55:18</text>
    <text x="14" y="34" class="row">[fixture] console.info: route</text>
  </g>
</svg>